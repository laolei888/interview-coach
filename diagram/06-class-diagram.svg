<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600">
  <style>
    text { font-family: 'SimSun','Microsoft YaHei',sans-serif; }
  </style>
  <rect width="850" height="600" fill="white"/>
  <text x="425" y="22" fill="black" font-size="16" font-weight="bold" text-anchor="middle">后端核心类图 (Controller / Service / Entity)</text>

  <!-- ============================================================ -->
  <!-- Controller Row -->
  <!-- ============================================================ -->
  <text x="30" y="50" fill="black" font-size="11" font-weight="bold">Controller 层</text>

  <rect x="20" y="60" width="185" height="115" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="112" y="78" fill="black" font-size="10" font-weight="bold" text-anchor="middle">UserController</text>
  <line x1="20" y1="85" x2="205" y2="85" stroke="black" stroke-width="0.5"/>
  <text x="28" y="100" fill="black" font-size="8">- userService: UserService</text>
  <line x1="20" y1="108" x2="205" y2="108" stroke="black" stroke-width="0.3"/>
  <text x="28" y="122" fill="black" font-size="8">+ register() POST /user/register</text>
  <text x="28" y="136" fill="black" font-size="8">+ login() POST /user/login</text>
  <text x="28" y="150" fill="black" font-size="8">+ getProfile() GET /user/me</text>
  <text x="28" y="164" fill="black" font-size="8">+ uploadAvatar() POST /user/avatar</text>

  <rect x="223" y="60" width="185" height="115" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="315" y="78" fill="black" font-size="10" font-weight="bold" text-anchor="middle">ResumeController</text>
  <line x1="223" y1="85" x2="408" y2="85" stroke="black" stroke-width="0.5"/>
  <text x="231" y="100" fill="black" font-size="8">- resumeService: ResumeService</text>
  <text x="231" y="112" fill="black" font-size="8">- chatClient: ChatClient</text>
  <line x1="223" y1="118" x2="408" y2="118" stroke="black" stroke-width="0.3"/>
  <text x="231" y="132" fill="black" font-size="8">+ analyzeResume(file) POST</text>
  <text x="231" y="146" fill="black" font-size="8">+ getHistory() GET</text>
  <text x="231" y="160" fill="black" font-size="8">+ getDetail(id) GET</text>

  <rect x="426" y="60" width="195" height="115" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="523" y="78" fill="black" font-size="10" font-weight="bold" text-anchor="middle">InterviewController ⭐</text>
  <line x1="426" y1="85" x2="621" y2="85" stroke="black" stroke-width="0.5"/>
  <text x="434" y="100" fill="black" font-size="8">- interviewService: InterviewSvc</text>
  <text x="434" y="112" fill="black" font-size="8">- rateLimiter: RateLimiter</text>
  <line x1="426" y1="118" x2="621" y2="118" stroke="black" stroke-width="0.3"/>
  <text x="434" y="132" fill="black" font-size="8">+ startInterview(pos) GET</text>
  <text x="434" y="146" fill="#c00" font-size="8">+ chatStream(sid,ans) SSE流式</text>
  <text x="434" y="160" fill="black" font-size="8">+ endInterview(sid) POST 评估报告</text>

  <rect x="639" y="60" width="185" height="115" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="731" y="78" fill="black" font-size="10" font-weight="bold" text-anchor="middle">QuestionController</text>
  <line x1="639" y1="85" x2="824" y2="85" stroke="black" stroke-width="0.5"/>
  <text x="647" y="100" fill="black" font-size="8">- questionService: QuestionSvc</text>
  <line x1="639" y1="108" x2="824" y2="108" stroke="black" stroke-width="0.3"/>
  <text x="647" y="122" fill="black" font-size="8">+ list(kw,cat,diff,page) GET</text>
  <text x="647" y="136" fill="black" font-size="8">+ aiGenerate() POST</text>
  <text x="647" y="150" fill="black" font-size="8">+ add(question) POST</text>

  <!-- arrows Controller -> Service -->
  <line x1="112" y1="175" x2="112" y2="212" stroke="black" stroke-width="0.7" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="315" y1="175" x2="315" y2="212" stroke="black" stroke-width="0.7" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="523" y1="175" x2="523" y2="212" stroke="black" stroke-width="0.7" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="731" y1="175" x2="731" y2="212" stroke="black" stroke-width="0.7" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- Service Row -->
  <!-- ============================================================ -->
  <text x="30" y="210" fill="black" font-size="11" font-weight="bold">Service 层 (extends MyBatis-Plus ServiceImpl)</text>

  <rect x="20" y="220" width="185" height="95" fill="#f8f8f8" stroke="black" stroke-width="1.3"/>
  <text x="112" y="238" fill="black" font-size="10" font-weight="bold" text-anchor="middle">UserService</text>
  <line x1="20" y1="246" x2="205" y2="246" stroke="black" stroke-width="0.3"/>
  <text x="28" y="262" fill="black" font-size="8">+ register(user, pwd): User</text>
  <text x="28" y="278" fill="black" font-size="8">+ login(user, pwd): String (JWT)</text>
  <text x="28" y="294" fill="black" font-size="8">+ changePassword(uid,old,new)</text>
  <text x="28" y="308" fill="#555" font-size="7">- md5(pwd): String</text>

  <rect x="223" y="220" width="185" height="95" fill="#f8f8f8" stroke="black" stroke-width="1.3"/>
  <text x="315" y="238" fill="black" font-size="10" font-weight="bold" text-anchor="middle">ResumeService</text>
  <line x1="223" y1="246" x2="408" y2="246" stroke="black" stroke-width="0.3"/>
  <text x="231" y="262" fill="black" font-size="8">+ parsePdf(file): String</text>
  <text x="231" y="278" fill="black" font-size="8">+ saveAnalysis(...): entity</text>
  <text x="231" y="298" fill="#555" font-size="7">- extractScore(fb): Integer</text>
  <text x="231" y="312" fill="#555" font-size="7">- extractMatchPosition(fb): Str</text>

  <rect x="426" y="220" width="195" height="95" fill="#f8f8f8" stroke="black" stroke-width="1.3"/>
  <text x="523" y="238" fill="black" font-size="10" font-weight="bold" text-anchor="middle">InterviewService ⭐</text>
  <line x1="426" y1="246" x2="621" y2="246" stroke="black" stroke-width="0.3"/>
  <text x="434" y="262" fill="black" font-size="8">+ createSession(pos): Session</text>
  <text x="434" y="278" fill="black" font-size="8">+ generateFirstQuestion(pos): Str</text>
  <text x="434" y="294" fill="#c00" font-size="8">+ chatStream(sid,ans): Flux&lt;Str&gt;</text>
  <text x="434" y="310" fill="black" font-size="8">+ generateSummary(sid): String</text>

  <rect x="639" y="220" width="185" height="95" fill="#f8f8f8" stroke="black" stroke-width="1.3"/>
  <text x="731" y="238" fill="black" font-size="10" font-weight="bold" text-anchor="middle">QuestionService</text>
  <line x1="639" y1="246" x2="824" y2="246" stroke="black" stroke-width="0.3"/>
  <text x="647" y="262" fill="black" font-size="8">+ generateByAi(cat,diff,ct): List</text>
  <text x="647" y="278" fill="black" font-size="8">+ page(kw,cat,diff,pg,sz): Page</text>

  <!-- ============================================================ -->
  <!-- Entity Row -->
  <!-- ============================================================ -->
  <text x="30" y="350" fill="black" font-size="11" font-weight="bold">Entity 实体层 (对应数据库表)</text>

  <rect x="20" y="360" width="150" height="140" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="95" y="378" fill="black" font-size="10" font-weight="bold" text-anchor="middle">User</text>
  <line x1="20" y1="385" x2="170" y2="385" stroke="black" stroke-width="0.3"/>
  <text x="28" y="400" fill="black" font-size="8">id: Long (PK)</text>
  <text x="28" y="415" fill="black" font-size="8">username: String</text>
  <text x="28" y="430" fill="black" font-size="8">password: String</text>
  <text x="28" y="445" fill="black" font-size="8">avatar: String</text>
  <text x="28" y="460" fill="black" font-size="8">gender: String</text>
  <text x="28" y="475" fill="black" font-size="8">email: String</text>
  <text x="28" y="490" fill="black" font-size="8">createdAt: LocalDateTime</text>

  <rect x="190" y="360" width="160" height="140" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="270" y="378" fill="black" font-size="9" font-weight="bold" text-anchor="middle">ResumeAnalysis</text>
  <line x1="190" y1="385" x2="350" y2="385" stroke="black" stroke-width="0.3"/>
  <text x="198" y="400" fill="black" font-size="8">id: Long (PK)</text>
  <text x="198" y="415" fill="black" font-size="8">fileName: String</text>
  <text x="198" y="430" fill="black" font-size="8">content: String</text>
  <text x="198" y="445" fill="black" font-size="8">aiScore: Integer</text>
  <text x="198" y="460" fill="black" font-size="8">aiFeedback: String</text>
  <text x="198" y="475" fill="black" font-size="8">matchPosition: String</text>
  <text x="198" y="490" fill="black" font-size="8">createdAt: LocalDateTime</text>

  <rect x="370" y="360" width="160" height="140" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="450" y="378" fill="black" font-size="9" font-weight="bold" text-anchor="middle">InterviewSession</text>
  <line x1="370" y1="385" x2="530" y2="385" stroke="black" stroke-width="0.3"/>
  <text x="378" y="400" fill="black" font-size="8">id: Long (PK)</text>
  <text x="378" y="415" fill="black" font-size="8">position: String</text>
  <text x="378" y="430" fill="black" font-size="8">status: String</text>
  <text x="378" y="450" fill="black" font-size="8">createdAt: LocalDateTime</text>
  <text x="378" y="470" fill="#555" font-size="7">status: active/completed</text>

  <rect x="550" y="360" width="160" height="140" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="630" y="378" fill="black" font-size="9" font-weight="bold" text-anchor="middle">InterviewMessage</text>
  <line x1="550" y1="385" x2="710" y2="385" stroke="black" stroke-width="0.3"/>
  <text x="558" y="400" fill="black" font-size="8">id: Long (PK)</text>
  <text x="558" y="415" fill="black" font-size="8">sessionId: Long (FK)</text>
  <text x="558" y="430" fill="black" font-size="8">role: String</text>
  <text x="558" y="445" fill="black" font-size="8">content: String</text>
  <text x="558" y="460" fill="black" font-size="8">score: Integer</text>
  <text x="558" y="475" fill="black" font-size="8">createdAt: LocalDateTime</text>
  <text x="558" y="495" fill="#555" font-size="7">role: ai / user</text>

  <rect x="730" y="360" width="100" height="140" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="780" y="378" fill="black" font-size="9" font-weight="bold" text-anchor="middle">Question</text>
  <line x1="730" y1="385" x2="830" y2="385" stroke="black" stroke-width="0.3"/>
  <text x="738" y="400" fill="black" font-size="8">id: Long</text>
  <text x="738" y="418" fill="black" font-size="8">category</text>
  <text x="738" y="436" fill="black" font-size="8">question</text>
  <text x="738" y="454" fill="black" font-size="8">answer</text>
  <text x="738" y="472" fill="black" font-size="8">difficulty</text>
  <text x="738" y="490" fill="black" font-size="8">createdAt</text>

  <!-- ============================================================ -->
  <!-- Config/Utils Row -->
  <!-- ============================================================ -->
  <text x="30" y="530" fill="black" font-size="11" font-weight="bold">配置/工具类</text>

  <rect x="20" y="540" width="140" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="90" y="557" fill="black" font-size="9" font-weight="bold" text-anchor="middle">JwtUtil</text>
  <text x="90" y="572" fill="black" font-size="8" text-anchor="middle">+ generate() + parse()</text>

  <rect x="175" y="540" width="140" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="245" y="557" fill="black" font-size="9" font-weight="bold" text-anchor="middle">RateLimiter</text>
  <text x="245" y="572" fill="black" font-size="8" text-anchor="middle">+ allow(key,limit,sec)</text>

  <rect x="330" y="540" width="140" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="400" y="557" fill="black" font-size="9" font-weight="bold" text-anchor="middle">LoginInterceptor</text>
  <text x="400" y="572" fill="black" font-size="8" text-anchor="middle">+ preHandle() JWT验证</text>

  <rect x="485" y="540" width="130" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="550" y="557" fill="black" font-size="9" font-weight="bold" text-anchor="middle">ChatClientConfig</text>
  <text x="550" y="572" fill="black" font-size="8" text-anchor="middle">+ chatClient() Bean</text>

  <rect x="630" y="540" width="150" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="705" y="557" fill="black" font-size="9" font-weight="bold" text-anchor="middle">GlobalExceptionHandler</text>
  <text x="705" y="572" fill="black" font-size="8" text-anchor="middle">@ControllerAdvice</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="black"/>
    </marker>
  </defs>
</svg>