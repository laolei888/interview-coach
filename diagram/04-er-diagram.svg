<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
  <style>
    text { font-family: 'SimSun','Microsoft YaHei',sans-serif; }
  </style>
  <rect width="850" height="520" fill="white"/>
  <text x="425" y="25" fill="black" font-size="16" font-weight="bold" text-anchor="middle">数据库E-R图</text>

  <!-- ========== User ========== -->
  <rect x="20" y="50" width="155" height="170" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="97" y="68" fill="black" font-size="11" font-weight="bold" text-anchor="middle">用户 (User)</text>
  <line x1="20" y1="76" x2="175" y2="76" stroke="black" stroke-width="0.5"/>
  <text x="28" y="92" fill="black" font-size="9">PK  id BIGINT</text>
  <text x="28" y="108" fill="black" font-size="9">username VARCHAR(50)</text>
  <text x="28" y="124" fill="black" font-size="9">password VARCHAR(64)</text>
  <text x="28" y="140" fill="black" font-size="9">avatar VARCHAR(255)</text>
  <text x="28" y="156" fill="black" font-size="9">gender VARCHAR(10)</text>
  <text x="28" y="172" fill="black" font-size="9">email VARCHAR(100)</text>
  <text x="28" y="188" fill="black" font-size="9">created_at DATETIME</text>

  <!-- ========== ResumeAnalysis ========== -->
  <rect x="215" y="50" width="170" height="170" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="300" y="68" fill="black" font-size="10" font-weight="bold" text-anchor="middle">简历分析 (ResumeAnalysis)</text>
  <line x1="215" y1="76" x2="385" y2="76" stroke="black" stroke-width="0.5"/>
  <text x="223" y="92" fill="black" font-size="9">PK  id BIGINT</text>
  <text x="223" y="108" fill="black" font-size="9">FK  user_id BIGINT</text>
  <text x="223" y="124" fill="black" font-size="9">file_name VARCHAR(255)</text>
  <text x="223" y="140" fill="black" font-size="9">content TEXT</text>
  <text x="223" y="156" fill="black" font-size="9">ai_score INT</text>
  <text x="223" y="172" fill="black" font-size="9">ai_feedback TEXT</text>
  <text x="223" y="188" fill="black" font-size="9">match_position VARCHAR</text>

  <!-- ========== InterviewSession ========== -->
  <rect x="425" y="50" width="170" height="140" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="510" y="68" fill="black" font-size="10" font-weight="bold" text-anchor="middle">面试会话 (Session)</text>
  <line x1="425" y1="76" x2="595" y2="76" stroke="black" stroke-width="0.5"/>
  <text x="433" y="92" fill="black" font-size="9">PK  id BIGINT</text>
  <text x="433" y="108" fill="black" font-size="9">FK  user_id BIGINT</text>
  <text x="433" y="124" fill="black" font-size="9">position VARCHAR(100)</text>
  <text x="433" y="140" fill="black" font-size="9">status VARCHAR(20)</text>
  <text x="433" y="156" fill="black" font-size="9">created_at DATETIME</text>
  <text x="433" y="172" fill="#555" font-size="8">status: active / completed</text>

  <!-- ========== InterviewMessage ========== -->
  <rect x="635" y="50" width="180" height="155" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="725" y="68" fill="black" font-size="10" font-weight="bold" text-anchor="middle">面试消息 (Message)</text>
  <line x1="635" y1="76" x2="815" y2="76" stroke="black" stroke-width="0.5"/>
  <text x="643" y="92" fill="black" font-size="9">PK  id BIGINT</text>
  <text x="643" y="108" fill="black" font-size="9">FK  session_id BIGINT</text>
  <text x="643" y="124" fill="black" font-size="9">role VARCHAR(20)</text>
  <text x="643" y="140" fill="black" font-size="9">content TEXT</text>
  <text x="643" y="156" fill="black" font-size="9">score INT</text>
  <text x="643" y="172" fill="black" font-size="9">created_at DATETIME</text>
  <text x="643" y="190" fill="#555" font-size="8">role: ai / user</text>

  <!-- ========== Question ========== -->
  <rect x="20" y="280" width="155" height="140" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="97" y="298" fill="black" font-size="10" font-weight="bold" text-anchor="middle">题库 (Question)</text>
  <line x1="20" y1="306" x2="175" y2="306" stroke="black" stroke-width="0.5"/>
  <text x="28" y="322" fill="black" font-size="9">PK  id BIGINT</text>
  <text x="28" y="338" fill="black" font-size="9">category VARCHAR(50)</text>
  <text x="28" y="354" fill="black" font-size="9">question TEXT</text>
  <text x="28" y="370" fill="black" font-size="9">answer TEXT</text>
  <text x="28" y="386" fill="black" font-size="9">difficulty VARCHAR(20)</text>
  <text x="28" y="402" fill="black" font-size="9">created_at DATETIME</text>

  <!-- ========== Relationships ========== -->
  <!-- User 1 to N ResumeAnalysis -->
  <line x1="175" y1="135" x2="213" y2="135" stroke="black" stroke-width="1.2"/>
  <text x="182" y="127" fill="black" font-size="8">1</text>
  <text x="204" y="127" fill="black" font-size="8">N</text>
  <text x="194" y="148" fill="black" font-size="8">上传</text>

  <!-- User 1 to N InterviewSession -->
  <path d="M 175 155 Q 195 155 195 120 Q 195 50 425 100" fill="none" stroke="black" stroke-width="1.2"/>
  <text x="250" y="100" fill="black" font-size="8">1</text>
  <text x="380" y="72" fill="black" font-size="8">N</text>
  <text x="310" y="88" fill="black" font-size="8">创建</text>

  <!-- InterviewSession 1-N InterviewMessage -->
  <line x1="595" y1="120" x2="633" y2="120" stroke="black" stroke-width="1.2"/>
  <text x="602" y="112" fill="black" font-size="8">1</text>
  <text x="624" y="112" fill="black" font-size="8">N</text>
  <text x="614" y="134" fill="black" font-size="8">包含</text>

  <!-- Question standalone note -->
  <text x="97" y="270" fill="#555" font-size="9" text-anchor="middle">(公共资源, 独立实体)</text>

  <!-- Legend -->
  <rect x="250" y="460" width="350" height="35" fill="white" stroke="black" stroke-width="0.8"/>
  <line x1="268" y1="478" x2="298" y2="478" stroke="black" stroke-width="1.2"/>
  <text x="302" y="482" fill="black" font-size="9">1 : N 关系 (外键关联)</text>
  <text x="430" y="482" fill="black" font-size="9">— 共5张表, InnoDB引擎, utf8mb4</text>
</svg>