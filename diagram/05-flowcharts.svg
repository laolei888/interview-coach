<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1000">
  <style>
    text { font-family: 'SimSun','Microsoft YaHei',sans-serif; }
  </style>
  <rect width="850" height="1000" fill="white"/>

  <text x="425" y="22" fill="black" font-size="15" font-weight="bold" text-anchor="middle">核心模块流程图</text>

  <!-- ============================================================ -->
  <!-- Flow 1: Auth -->
  <!-- ============================================================ -->
  <text x="35" y="50" fill="black" font-size="12" font-weight="bold">图1 用户登录认证流程 (JWT)</text>

  <!-- Start -->
  <rect x="120" y="62" width="110" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="175" y="80" fill="black" font-size="10" text-anchor="middle">开始</text>
  <line x1="175" y1="90" x2="175" y2="110" stroke="black" stroke-width="1"/>

  <rect x="95" y="112" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="130" fill="black" font-size="10" text-anchor="middle">输入用户名和密码</text>
  <line x1="175" y1="140" x2="175" y2="160" stroke="black" stroke-width="1"/>

  <polygon points="175,165 225,195 175,225 125,195" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="199" fill="black" font-size="9" text-anchor="middle">验证通过?</text>

  <!-- Yes -->
  <line x1="175" y1="225" x2="175" y2="252" stroke="black" stroke-width="1"/>
  <text x="182" y="242" fill="black" font-size="8">是</text>
  <rect x="95" y="255" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="273" fill="black" font-size="10" text-anchor="middle">生成JWT Token 返回</text>
  <line x1="175" y1="283" x2="175" y2="303" stroke="black" stroke-width="1"/>

  <rect x="95" y="306" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="324" fill="black" font-size="10" text-anchor="middle">前端存储Token 跳转首页</text>
  <line x1="175" y1="334" x2="175" y2="354" stroke="black" stroke-width="1"/>

  <rect x="120" y="357" width="110" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="175" y="375" fill="black" font-size="10" text-anchor="middle">结束</text>

  <!-- No -->
  <line x1="225" y1="195" x2="300" y2="195" stroke="black" stroke-width="1"/>
  <text x="240" y="188" fill="black" font-size="8">否</text>
  <rect x="305" y="181" width="120" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="365" y="199" fill="black" font-size="10" text-anchor="middle">提示错误信息</text>

  <!-- ============================================================ -->
  <!-- Flow 2: Resume -->
  <!-- ============================================================ -->
  <line x1="0" y1="410" x2="850" y2="410" stroke="black" stroke-width="0.3" stroke-dasharray="4,2"/>
  <text x="35" y="435" fill="black" font-size="12" font-weight="bold">图2 简历智能分析流程</text>

  <rect x="120" y="447" width="110" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="175" y="465" fill="black" font-size="10" text-anchor="middle">选择PDF文件</text>
  <line x1="175" y1="475" x2="175" y2="495" stroke="black" stroke-width="1"/>

  <polygon points="175,500 225,530 175,560 125,530" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="534" fill="black" font-size="9" text-anchor="middle">PDF有效?</text>

  <!-- Yes -->
  <line x1="175" y1="560" x2="175" y2="587" stroke="black" stroke-width="1"/>
  <text x="182" y="577" fill="black" font-size="8">是</text>
  <rect x="85" y="590" width="180" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="608" fill="black" font-size="10" text-anchor="middle">Apache PDFBox 提取文本</text>
  <line x1="175" y1="618" x2="175" y2="640" stroke="black" stroke-width="1"/>

  <rect x="85" y="643" width="180" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="661" fill="black" font-size="10" text-anchor="middle">构造Prompt → DeepSeek分析</text>
  <line x1="175" y1="671" x2="175" y2="693" stroke="black" stroke-width="1"/>

  <rect x="85" y="696" width="180" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="175" y="714" fill="black" font-size="10" text-anchor="middle">返回评分+亮点+建议+岗位</text>

  <!-- No -->
  <line x1="225" y1="530" x2="300" y2="530" stroke="black" stroke-width="1"/>
  <text x="240" y="523" fill="black" font-size="8">否</text>
  <rect x="305" y="516" width="120" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="365" y="534" fill="black" font-size="10" text-anchor="middle">返回错误信息</text>

  <!-- ============================================================ -->
  <!-- Flow 3: Interview (larger, center) -->
  <!-- ============================================================ -->
  <line x1="0" y1="750" x2="850" y2="750" stroke="black" stroke-width="0.3" stroke-dasharray="4,2"/>
  <text x="35" y="775" fill="black" font-size="12" font-weight="bold">图3 AI模拟面试SSE流式对话流程 ⭐</text>

  <rect x="330" y="790" width="130" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="395" y="808" fill="black" font-size="10" text-anchor="middle">选择岗位→开始</text>
  <line x1="395" y1="818" x2="395" y2="840" stroke="black" stroke-width="1"/>

  <rect x="320" y="843" width="150" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="395" y="861" fill="black" font-size="10" text-anchor="middle">AI生成首问+建Session</text>
  <line x1="395" y1="871" x2="395" y2="893" stroke="black" stroke-width="1"/>

  <!-- Loop box -->
  <rect x="280" y="896" width="230" height="150" fill="white" stroke="black" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="290" y="910" fill="black" font-size="9">循环[对话轮次]</text>

  <rect x="300" y="920" width="190" height="24" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="395" y="936" fill="black" font-size="9" text-anchor="middle">用户输入回答(支持语音)</text>
  <line x1="395" y1="944" x2="395" y2="960" stroke="black" stroke-width="0.8"/>

  <rect x="300" y="963" width="190" height="24" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="395" y="979" fill="black" font-size="9" text-anchor="middle">构建上下文→AI流式追问</text>
  <line x1="395" y1="987" x2="395" y2="1003" stroke="black" stroke-width="0.8"/>

  <rect x="300" y="1006" width="190" height="24" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="395" y="1022" fill="black" font-size="9" text-anchor="middle">SSE逐字推送 前端逐字渲染</text>

  <!-- Decision -->
  <line x1="395" y1="1046" x2="395" y2="1075" stroke="black" stroke-width="1"/>
  <polygon points="395,1080 440,1105 395,1130 350,1105" fill="white" stroke="black" stroke-width="1"/>
  <text x="395" y="1109" fill="black" font-size="9" text-anchor="middle">结束面试?</text>

  <!-- Loop back -->
  <path d="M 510 1105 Q 570 1105 570 960 Q 570 932 510 932" fill="none" stroke="black" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="578" y="1020" fill="black" font-size="8">否:继续</text>

  <!-- Yes -->
  <line x1="395" y1="1130" x2="395" y2="1160" stroke="black" stroke-width="1"/>
  <text x="402" y="1150" fill="black" font-size="8">是</text>

  <rect x="310" y="1163" width="170" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="395" y="1181" fill="black" font-size="10" text-anchor="middle">AI生成评估报告×完成</text>

  <!-- ============================================================ -->
  <!-- Flow 4: AI Questions (right side, compact) -->
  <!-- ============================================================ -->
  <text x="560" y="50" fill="black" font-size="12" font-weight="bold">图4 AI批量出题流程</text>

  <rect x="640" y="62" width="110" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="695" y="80" fill="black" font-size="10" text-anchor="middle">选分类/难度/数量</text>
  <line x1="695" y1="90" x2="695" y2="110" stroke="black" stroke-width="1"/>

  <rect x="615" y="113" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="695" y="131" fill="black" font-size="10" text-anchor="middle">构造Prompt→DeepSeek</text>
  <line x1="695" y1="141" x2="695" y2="161" stroke="black" stroke-width="1"/>

  <rect x="615" y="164" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="695" y="182" fill="black" font-size="10" text-anchor="middle">AI返回格式化题目块</text>
  <line x1="695" y1="192" x2="695" y2="212" stroke="black" stroke-width="1"/>

  <rect x="615" y="215" width="160" height="28" fill="white" stroke="black" stroke-width="1"/>
  <text x="695" y="233" fill="black" font-size="10" text-anchor="middle">按"---"分割→解析入库</text>
  <line x1="695" y1="243" x2="695" y2="263" stroke="black" stroke-width="1"/>

  <rect x="640" y="266" width="110" height="28" rx="14" fill="#e8f0fe" stroke="black" stroke-width="1.2"/>
  <text x="695" y="284" fill="black" font-size="10" text-anchor="middle">刷新列表展示</text>

  <!-- Legend -->
  <rect x="280" y="940" width="230" height="55" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="290" y="956" fill="black" font-size="9" font-weight="bold">图例</text>
  <rect x="290" y="966" width="18" height="10" rx="5" fill="#e8f0fe" stroke="black" stroke-width="0.8"/>
  <text x="312" y="975" fill="black" font-size="8">开始/结束</text>
  <rect x="380" y="966" width="18" height="10" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="402" y="975" fill="black" font-size="8">处理步骤</text>
  <polygon points="458,976 466,966 474,976" fill="white" stroke="black" stroke-width="0.8"/>
  <text x="480" y="975" fill="black" font-size="8">条件判断</text>
</svg>