<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    text { font-family: 'SimSun','Microsoft YaHei',sans-serif; }
  </style>
  <rect width="800" height="600" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" fill="black" font-size="16" font-weight="bold" text-anchor="middle">系统用例图</text>

  <!-- System boundary box -->
  <rect x="280" y="50" width="490" height="520" rx="0" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="290" y="68" fill="black" font-size="11">AI智能面试辅导平台</text>

  <!-- Actor (stick figure) -->
  <circle cx="100" cy="230" r="14" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="100" y1="244" x2="100" y2="280" stroke="black" stroke-width="1.5"/>
  <line x1="100" y1="256" x2="78" y2="272" stroke="black" stroke-width="1.5"/>
  <line x1="100" y1="256" x2="122" y2="272" stroke="black" stroke-width="1.5"/>
  <line x1="100" y1="280" x2="80" y2="306" stroke="black" stroke-width="1.5"/>
  <line x1="100" y1="280" x2="120" y2="306" stroke="black" stroke-width="1.5"/>
  <text x="100" y="325" fill="black" font-size="13" font-weight="bold" text-anchor="middle">求职者</text>

  <!-- Use cases - left column -->
  <ellipse cx="400" cy="120" rx="80" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="400" y="124" fill="black" font-size="11" text-anchor="middle">注册账号</text>

  <ellipse cx="400" cy="195" rx="80" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="400" y="199" fill="black" font-size="11" text-anchor="middle">登录系统</text>

  <ellipse cx="400" cy="420" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="400" y="424" fill="black" font-size="11" text-anchor="middle">管理个人资料</text>

  <ellipse cx="400" cy="500" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="400" y="504" fill="black" font-size="11" text-anchor="middle">查看数据看板</text>

  <!-- Use cases - right column -->
  <ellipse cx="620" cy="120" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="620" y="124" fill="black" font-size="11" text-anchor="middle">上传简历分析</text>

  <ellipse cx="620" cy="250" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="620" y="254" fill="black" font-size="11" text-anchor="middle">AI模拟面试</text>

  <ellipse cx="620" cy="380" rx="80" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="620" y="384" fill="black" font-size="11" text-anchor="middle">浏览题库</text>

  <ellipse cx="620" cy="470" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="620" y="474" fill="black" font-size="11" text-anchor="middle">查看历史记录</text>

  <!-- Include use cases (far right, smaller) -->
  <ellipse cx="740" cy="70" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="74" fill="black" font-size="9" text-anchor="middle">PDF文本提取</text>

  <ellipse cx="740" cy="130" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="134" fill="black" font-size="9" text-anchor="middle">AI多维度评估</text>

  <ellipse cx="740" cy="210" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="214" fill="black" font-size="9" text-anchor="middle">SSE流式对话</text>

  <ellipse cx="740" cy="270" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="274" fill="black" font-size="9" text-anchor="middle">生成评估报告</text>

  <ellipse cx="740" cy="340" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="344" fill="black" font-size="9" text-anchor="middle">搜索题目</text>

  <ellipse cx="740" cy="440" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="444" fill="black" font-size="9" text-anchor="middle">语音输入</text>

  <ellipse cx="740" cy="510" rx="55" ry="18" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="740" y="514" fill="black" font-size="9" text-anchor="middle">AI批量出题</text>

  <!-- Association lines (actor to use cases) -->
  <line x1="179" y1="210" x2="318" y2="120" stroke="black" stroke-width="1"/>
  <line x1="179" y1="215" x2="318" y2="195" stroke="black" stroke-width="1"/>
  <line x1="179" y1="225" x2="318" y2="250" stroke="black" stroke-width="1"/>
  <line x1="179" y1="230" x2="533" y2="120" stroke="black" stroke-width="1"/>
  <line x1="179" y1="235" x2="533" y2="250" stroke="black" stroke-width="1"/>
  <line x1="179" y1="240" x2="533" y2="380" stroke="black" stroke-width="1"/>
  <line x1="179" y1="245" x2="533" y2="470" stroke="black" stroke-width="1"/>
  <line x1="179" y1="250" x2="318" y2="420" stroke="black" stroke-width="1"/>
  <line x1="179" y1="255" x2="318" y2="500" stroke="black" stroke-width="1"/>

  <!-- Include / Extend lines (dashed) -->
  <line x1="706" y1="110" x2="685" y2="70" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="707" y="88" fill="black" font-size="7">«include»</text>
  <line x1="706" y1="125" x2="685" y2="130" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="707" y="123" fill="black" font-size="7">«include»</text>
  <line x1="706" y1="240" x2="685" y2="210" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="707" y="222" fill="black" font-size="7">«include»</text>
  <line x1="706" y1="255" x2="685" y2="270" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="707" y="258" fill="black" font-size="7">«include»</text>
  <line x1="701" y1="375" x2="685" y2="340" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="702" y="355" fill="black" font-size="7">«include»</text>
  <line x1="701" y1="390" x2="685" y2="440" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="702" y="415" fill="black" font-size="7">«extend»</text>
  <line x1="701" y1="465" x2="685" y2="510" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="702" y="490" fill="black" font-size="7">«extend»</text>

  <!-- Legend -->
  <rect x="310" y="555" width="180" height="25" fill="white" stroke="black" stroke-width="0.8"/>
  <line x1="320" y1="568" x2="345" y2="568" stroke="black" stroke-width="1"/>
  <text x="348" y="572" fill="black" font-size="9">关联</text>
  <line x1="390" y1="568" x2="415" y2="568" stroke="black" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="418" y="572" fill="black" font-size="9">include/extend</text>
</svg>