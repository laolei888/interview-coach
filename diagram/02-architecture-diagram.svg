<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650">
  <style>
    text { font-family: 'SimSun','Microsoft YaHei',sans-serif; }
  </style>
  <rect width="750" height="650" fill="white"/>

  <text x="375" y="25" fill="black" font-size="16" font-weight="bold" text-anchor="middle">系统架构图</text>

  <!-- Layer 1 -->
  <rect x="30" y="45" width="690" height="120" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="45" y="64" fill="black" font-size="12" font-weight="bold">表示层 (前端)</text>

  <rect x="55" y="77" width="180" height="40" fill="#f0f4ff" stroke="black" stroke-width="1"/>
  <text x="145" y="96" fill="black" font-size="10" text-anchor="middle">Vue 3 + Element Plus</text>
  <text x="145" y="110" fill="#555" font-size="8" text-anchor="middle">Pinia · Vue Router</text>

  <rect x="260" y="77" width="140" height="40" fill="#f0f4ff" stroke="black" stroke-width="1"/>
  <text x="330" y="96" fill="black" font-size="10" text-anchor="middle">Axios / Fetch</text>
  <text x="330" y="110" fill="#555" font-size="8" text-anchor="middle">HTTP · SSE客户端</text>

  <rect x="425" y="77" width="120" height="40" fill="#f0f4ff" stroke="black" stroke-width="1"/>
  <text x="485" y="96" fill="black" font-size="10" text-anchor="middle">路由守卫</text>
  <text x="485" y="110" fill="#555" font-size="8" text-anchor="middle">JWT验证</text>

  <rect x="570" y="77" width="125" height="40" fill="#f0f4ff" stroke="black" stroke-width="1"/>
  <text x="632" y="96" fill="black" font-size="10" text-anchor="middle">浏览器</text>
  <text x="632" y="110" fill="#555" font-size="8" text-anchor="middle">localhost:5173</text>

  <!-- Arrow L1 -> L2 -->
  <line x1="375" y1="165" x2="375" y2="190" stroke="black" stroke-width="1.2" marker-end="url(#arrowB)"/>
  <text x="388" y="182" fill="#333" font-size="8">REST / SSE</text>

  <!-- Layer 2 -->
  <rect x="30" y="195" width="690" height="120" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="45" y="214" fill="black" font-size="12" font-weight="bold">业务逻辑层 (Spring Boot 3.3.5)</text>

  <rect x="55" y="227" width="185" height="40" fill="#f0fff0" stroke="black" stroke-width="1"/>
  <text x="147" y="246" fill="black" font-size="10" text-anchor="middle">Controller (REST API)</text>
  <text x="147" y="260" fill="#555" font-size="8" text-anchor="middle">User · Resume · Interview · Question</text>

  <rect x="265" y="227" width="185" height="40" fill="#f0fff0" stroke="black" stroke-width="1"/>
  <text x="357" y="246" fill="black" font-size="10" text-anchor="middle">Service (业务逻辑)</text>
  <text x="357" y="260" fill="#555" font-size="8" text-anchor="middle">extends MyBatis-Plus ServiceImpl</text>

  <rect x="475" y="227" width="120" height="40" fill="#fff0f0" stroke="black" stroke-width="1"/>
  <text x="535" y="246" fill="black" font-size="10" text-anchor="middle">安全横切</text>
  <text x="535" y="260" fill="#555" font-size="8" text-anchor="middle">JWT · 限流 · 异常处理</text>

  <rect x="618" y="227" width="80" height="40" fill="#fff8f0" stroke="black" stroke-width="1"/>
  <text x="658" y="246" fill="black" font-size="10" text-anchor="middle">Spring AI</text>
  <text x="658" y="260" fill="#555" font-size="8" text-anchor="middle">ChatClient</text>

  <!-- Arrow L2 -> L3 -->
  <line x1="375" y1="315" x2="375" y2="340" stroke="black" stroke-width="1.2" marker-end="url(#arrowB)"/>
  <text x="388" y="332" fill="#333" font-size="8">HTTP/OpenAI协议</text>

  <!-- Layer 3 -->
  <rect x="30" y="345" width="690" height="90" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="45" y="364" fill="black" font-size="12" font-weight="bold">AI服务层</text>

  <rect x="55" y="377" width="230" height="40" fill="#fffff0" stroke="black" stroke-width="1"/>
  <text x="170" y="396" fill="black" font-size="10" text-anchor="middle">DeepSeek Chat API</text>
  <text x="170" y="410" fill="#555" font-size="8" text-anchor="middle">deepseek-chat · 兼容OpenAI</text>

  <rect x="310" y="377" width="200" height="40" fill="#fffff0" stroke="black" stroke-width="1"/>
  <text x="410" y="396" fill="black" font-size="10" text-anchor="middle">流式 (Flux+SSE)</text>
  <text x="410" y="410" fill="#555" font-size="8" text-anchor="middle">stream().content()</text>

  <rect x="535" y="377" width="160" height="40" fill="#fffff0" stroke="black" stroke-width="1"/>
  <text x="615" y="396" fill="black" font-size="10" text-anchor="middle">非流式</text>
  <text x="615" y="410" fill="#555" font-size="8" text-anchor="middle">call().content()</text>

  <!-- Arrow L3 -> L4 (goes back up through L2 from L3, actually L2<->L4) -->
  <line x1="375" y1="435" x2="375" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrowB)"/>
  <text x="388" y="452" fill="#333" font-size="8">JDBC / Redis协议</text>

  <!-- Layer 4 -->
  <rect x="30" y="465" width="690" height="90" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="45" y="484" fill="black" font-size="12" font-weight="bold">数据存储层</text>

  <rect x="55" y="497" width="170" height="40" fill="#f5f0ff" stroke="black" stroke-width="1"/>
  <text x="140" y="516" fill="black" font-size="10" text-anchor="middle">MySQL 8.0</text>
  <text x="140" y="530" fill="#555" font-size="8" text-anchor="middle">用户·题库·面试·简历</text>

  <rect x="250" y="497" width="140" height="40" fill="#f5f0ff" stroke="black" stroke-width="1"/>
  <text x="320" y="516" fill="black" font-size="10" text-anchor="middle">Redis 6</text>
  <text x="320" y="530" fill="#555" font-size="8" text-anchor="middle">限流计数器</text>

  <rect x="415" y="497" width="140" height="40" fill="#f5f0ff" stroke="black" stroke-width="1"/>
  <text x="485" y="516" fill="black" font-size="10" text-anchor="middle">本地文件系统</text>
  <text x="485" y="530" fill="#555" font-size="8" text-anchor="middle">头像·PDF上传</text>

  <rect x="580" y="497" width="115" height="40" fill="#f5f0ff" stroke="black" stroke-width="1"/>
  <text x="637" y="516" fill="black" font-size="10" text-anchor="middle">MyBatis-Plus</text>
  <text x="637" y="530" fill="#555" font-size="8" text-anchor="middle">ORM分页</text>

  <!-- Tech stack summary -->
  <text x="375" y="585" fill="black" font-size="11" font-weight="bold" text-anchor="middle">技术栈: JDK17 · Spring Boot 3.3.5 · Vue 3 · MySQL 8.0 · Redis · DeepSeek · Maven · Vite</text>

  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>