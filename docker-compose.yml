services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: interview_coach
      MYSQL_ROOT_PASSWORD: ${INTERVIEW_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${INTERVIEW_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      INTERVIEW_DB_PASSWORD: ${INTERVIEW_DB_PASSWORD}
      INTERVIEW_JWT_SECRET: ${INTERVIEW_JWT_SECRET}
      INTERVIEW_AI_TIMEOUT_SECONDS: ${INTERVIEW_AI_TIMEOUT_SECONDS:-45}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/interview_coach?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  uploads-data:
